{% extends "admin/index.html" %}
{% load i18n %}
{% block content %}
{% if attention %}
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 24px">
{% for label, n, url_name, qs in attention %}
  <a href="{% url url_name %}{{ qs }}" style="display:block;padding:16px 18px;border-radius:12px;background:{% if n and forloop.counter < 4 %}#fff4e5{% else %}#eef6f8{% endif %};border:1px solid {% if n and forloop.counter < 4 %}#f5b041{% else %}#cfe3e8{% endif %};text-decoration:none;color:inherit">
    <div style="font-size:28px;font-weight:700;color:#0b3d5c">{{ n }}</div><div style="font-size:13px">{{ label }}</div></a>
{% endfor %}
</div>
{% endif %}
{{ block.super }}
{% endblock %}
