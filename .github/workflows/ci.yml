name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt polib
      - name: Django system check
        run: python manage.py check
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Arabic translations are complete and compiled
        run: |
          python tools/i18n_build.py --check
          git diff --exit-code locale || (echo "Run python tools/i18n_build.py and commit locale/" && exit 1)
      - name: Tests
        run: python manage.py test core -v 2
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t sianexis:ci .
